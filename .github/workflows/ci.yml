name: Validate, package and publish
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_marketplace:
        description: Verify Marketplace OIDC policy without publishing
        type: boolean
        default: false
      publish_preview_run:
        description: Publish the unchanged VSIX from a successful preview release run ID
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: markyou-${{ github.workflow }}-${{ github.ref }}-${{ inputs.verify_marketplace && 'auth' || inputs.publish_preview_run || 'verify' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_marketplace && !inputs.publish_preview_run)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-tag.mjs
      - run: npm run check
      - run: npm run brand:audit
      - name: Install UI browser (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install UI test browser (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run bench
      - name: Package Windows VSIX
        if: runner.os == 'Windows'
        env:
          MARKYOU_PRE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        run: npm run package
      - name: Audit exact VSIX and record checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $vsix = "markyou-win32-x64-$version.vsix"
          node scripts/brand-audit.mjs --vsix $vsix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLower()
          "$hash  $vsix" | Set-Content -Encoding utf8 SHA256SUMS.txt
      - name: Prepare isolated VS Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $editorDirectory = Join-Path $env:RUNNER_TEMP 'markyou-vscode'
          $editorArchive = Join-Path $env:RUNNER_TEMP 'markyou-vscode.zip'
          Invoke-WebRequest 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $editorArchive
          Expand-Archive -LiteralPath $editorArchive -DestinationPath $editorDirectory
          "VSCODE_EXECUTABLE=$(Join-Path $editorDirectory 'Code.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test development extension and installed VSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run test:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/test-host.mjs "markyou-win32-x64-$version.vsix"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: markyou-vsix
          if-no-files-found: error
          overwrite: true
          path: |
            markyou-win32-x64-*.vsix
            SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          retention-days: 7
          overwrite: true
          path: |
            test-results/
            bench/results/*.json
  marketplace-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exchange OIDC identity without uploading an extension
        run: node scripts/check-marketplace-oidc.mjs
  acceptance:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: markyou-vsix
      - name: Load manual acceptance for this exact package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release download "$env:RELEASE_TAG" --pattern acceptance.json --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Stable release requires acceptance.json attached to a draft release. Download the markyou-vsix artifact, verify that package, upload its evidence, then rerun failed jobs.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath "markyou-win32-x64-$version.vsix" -Destination release/package.zip
          Expand-Archive -LiteralPath release/package.zip -DestinationPath release/unpacked
          Copy-Item -LiteralPath release/unpacked/extension/dist -Destination dist -Recurse
          node scripts/check-release.mjs release/acceptance.json
          exit $LASTEXITCODE
  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' && (needs.acceptance.result == 'success' || needs.acceptance.result == 'skipped')
    needs: [verify, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: markyou-vsix
          path: release
      - name: Publish tested VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          sed -i '1s/^\xEF\xBB\xBF//' SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.vsix README.md README.zh-CN.md --clobber
            gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" release/*.vsix README.md README.zh-CN.md --verify-tag --generate-notes --title "MarkYou $RELEASE_TAG" "${flags[@]}"
          fi
  marketplace:
    if: always() && ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview_run != ''))
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify the source of the tested release package
        id: package-source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PREVIEW_RUN: ${{ inputs.publish_preview_run }}
        run: node scripts/prepare-marketplace-publish.mjs
      - uses: actions/download-artifact@v4
        with:
          name: markyou-vsix
          path: release
          run-id: ${{ steps.package-source.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Publish tested package to VS Code Marketplace
        env:
          RELEASE_TAG: ${{ steps.package-source.outputs.release_tag }}
        shell: bash
        run: |
          cd release
          sed -i '1s/^\xEF\xBB\xBF//' SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--pre-release); fi
          npx --no-install vsce publish --oidc --packagePath release/*.vsix --skip-duplicate "${flags[@]}"
